<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>airlock session viewer</title>
  <meta name="description" content="Timeline, integrity check and policy decisions for an airlock MCP session log. Logs are parsed in the browser and never uploaded.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='26' height='26' rx='7' fill='%23101820' stroke='%23e8b04a' stroke-width='2.5'/%3E%3Cpath d='M11 9v14M21 9v14' stroke='%2363c7b2' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="top">
    <div class="brand"><span class="mark" aria-hidden="true"></span>airlock<span class="mode" id="mode"></span></div>
    <select id="session" aria-label="Session" hidden></select>
    <label class="open-btn">Open a log<input type="file" id="file" accept=".jsonl,.json,.log,application/x-ndjson" multiple hidden></label>
    <span class="hint">or drop one anywhere. Files are read in this tab and never uploaded.</span>
    <span id="status" class="status" role="status"></span>
  </header>

  <section id="summary" class="summary" aria-label="Session summary"></section>

  <main>
    <section class="list" aria-label="Timeline">
      <div class="toolbar">
        <div id="filters" role="tablist">
          <button data-f="all" class="on">All</button>
          <button data-f="calls">Tool calls</button>
          <button data-f="flagged">Blocked &amp; flagged</button>
          <button data-f="protocol">Messages</button>
          <button data-f="stderr">Server stderr</button>
        </div>
        <input id="search" type="search" placeholder="Filter" aria-label="Filter rows">
        <span id="count" class="count"></span>
      </div>
      <ol id="rows"></ol>
    </section>
    <section id="detail" class="detail" aria-label="Details"><p class="empty">Select a row.</p></section>
  </main>

  <div class="dropzone" aria-hidden="true"><div>Drop a session log</div></div>
</body>
</html>
