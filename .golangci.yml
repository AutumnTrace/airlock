version: "2"

linters:
  default: standard
  enable:
    - misspell
    - unconvert
    - errorlint
    - gocritic
  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (*bufio.Writer).Flush
        - (*bufio.Writer).Write
        - (*bufio.Writer).WriteByte
        - io.WriteString
        - (*io.PipeWriter).Close
        - (*io.PipeWriter).Write
        - os.RemoveAll
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [errcheck]
