version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    groups:
      gomod:
        patterns: ['*']

  - package-ecosystem: gomod
    directory: /demo
    schedule:
      interval: monthly
    groups:
      demo:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
